appId: com.irl.app
name: Sign up — happy path
---
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn: "Create an account"
- inputText:
    label: "Email"
    text: "test+${MAESTRO_TIMESTAMP}@irl.example"
- inputText:
    label: "Password"
    text: "TestPassw0rd!"
- inputText:
    label: "Confirm password"
    text: "TestPassw0rd!"
- tapOn: "Continue"
# Step controller drives 11 onboarding screens; assert the last one then land on Explore.
- assertVisible: "Step 11 of 11"
- tapOn: "Continue"
- assertVisible: "Explore"
