pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm eslint --fix --max-warnings=0 {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{ts,tsx,js,json,md,yml,yaml,mjs}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: pnpm typecheck
    lint:
      run: pnpm lint
    test:
      run: pnpm test:coverage
