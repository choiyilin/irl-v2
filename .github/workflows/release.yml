name: Release

on:
  push:
    tags:
      - 'v*'

env:
  PNPM_VERSION: '9.12.0'
  NODE_VERSION: '20.18'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck + Lint + Format + Tests
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test:coverage
      - name: EAS production build + auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm exec eas build --profile production --platform ios --non-interactive --auto-submit
